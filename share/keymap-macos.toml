# metamorse keymap -- macOS defaults.
#
# Paths are space-separated Morse letters.
#
#   { sh  = "..." }   run a shell command, detached
#   { key = "..." }   synthesize a chord, e.g. "cmd+shift+4"
#   { hint = "..." }  label a branch (a prefix with no action of its own)
#
# TWO SPECIAL LETTERS
#   e  (.)  a bare Meta tap. Permanently unbound so the tap passes through to
#           whatever has focus. Never bind it.
#   t  (-)  the gesture you hit by accident. Auto-bound to a popup listing
#           every binding, so an accidental trigger costs nothing.
#
# COST -- spend short codes on what you use most
#   2  i(..)  a(.-)  n(-.)  m(--)
#   3  s(...) u(..-) r(.-.) w(.--) d(-..) k(-.-) g(--.) o(---)
#   4  h v f l p j b x c y z q
#
# A starting point: everything here ships with macOS.
# Replace with what you actually run -- `metamorse edit`.

"a" = { sh = "open -a Terminal", hint = "terminal" }
"n" = { sh = "open https://duckduckgo.com", hint = "browser" }
"i" = { sh = "open ~", hint = "finder" }

"s" = { key = "cmd+shift+4", hint = "screenshot region" }

"u"   = { hint = "urls" }
"u g" = { sh = "open https://github.com", hint = "github" }
"u c" = { sh = "open https://claude.ai", hint = "claude" }
