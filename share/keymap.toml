# metamorse keymap. Paths are space-separated Morse letters.
#
#   { sh  = "..." }   run a shell command, detached
#   { key = "..." }   synthesize a chord, e.g. "ctrl+shift+t"
#   { hint = "..." }  label a branch (a prefix with no action of its own)
#
# Two letters are special:
#
#   e  (.)  a single dot -- a bare Meta tap. Permanently unbound so the tap
#           passes through to whatever has focus. Never bind it.
#   t  (-)  a single dash -- the gesture you hit by accident. Bound
#           automatically to a popup listing every binding, so an accidental
#           trigger is free. Bind it yourself only if you want that slot back.
#
# Letters cost what they cost. Spend the short codes on what you use most:
#   2 symbols  i(..) a(.-) n(-.) m(--)
#   3 symbols  s u r w d k g o
#   4 symbols  h v f l p j b x c y z q

"a" = { sh = "x-terminal-emulator", hint = "terminal" }
"n" = { sh = "xdg-open https://", hint = "browser" }

"g"   = { hint = "git" }
"g s" = { sh = "x-terminal-emulator -e git status", hint = "status" }
"g l" = { sh = "x-terminal-emulator -e git log --oneline -20", hint = "log" }

"w"   = { hint = "window" }
"w c" = { key = "super+c", hint = "close" }
"w m" = { key = "super+m", hint = "maximize" }
